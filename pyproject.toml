[project]
name = "practica"
version = "0.1.0"
description = "Учебная практика по компьютерному зрению"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=1.4.18",
    "effdet>=0.4.1",
    "matplotlib>=3.7.5",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0",
    "timm>=1.0.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.0.0",
    "ultralytics>=8.4.86",
]

[project.scripts]
practica = "practica.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
